name: Build ManiFlix Desktop (Windows + macOS + Linux)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Native Rust (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build ManiFlix.exe (Release)
        shell: pwsh
        run: |
          Set-Location windows
          cargo build --release
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          Copy-Item target/release/ManiFlix.exe ../dist/ManiFlix.exe -Force

      - name: Run Self-Test Hardware & Binary Verification
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./dist/ManiFlix.exe -ArgumentList "--self-test", "out.json" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Self-test exited with $($p.ExitCode)" }
          Get-Content out.json
          $raw = Get-Content out.json -Raw
          if (-not $raw.Contains("SELF_TEST_OK")) { throw "Missing SELF_TEST_OK" }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManiFlix-Windows
          path: dist/ManiFlix.exe
          retention-days: 30

  build-macos:
    name: Build macOS Liquid Glass (.dmg)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode & Install XcodeGen
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          swift --version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Normalize AppIcon to 1024x1024 opaque PNG
        run: |
          ICON_SRC="macos/ManiFlixMac/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          sips -s format bmp "$ICON_SRC" --out /tmp/appicon.bmp
          sips -s format png -z 1024 1024 /tmp/appicon.bmp --out "$ICON_SRC"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON_SRC"

      - name: Generate Xcode Project & Build Release ManiFlix.app
        run: |
          cd macos
          xcodegen generate
          xcodebuild archive \
            -project ManiFlixMac.xcodeproj \
            -scheme ManiFlixMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath /tmp/dd-mac \
            -archivePath /tmp/ManiFlixMac.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package ManiFlix.app into ManiFlix-macOS.dmg
        run: |
          mkdir -p dist /tmp/dmg-stage
          cp -R /tmp/ManiFlixMac.xcarchive/Products/Applications/ManiFlix.app /tmp/dmg-stage/ManiFlix.app
          codesign --force --deep --sign - /tmp/dmg-stage/ManiFlix.app || true
          ln -s /Applications /tmp/dmg-stage/Applications
          hdiutil create -volname "ManiFlix" -srcfolder /tmp/dmg-stage -ov -format UDZO dist/ManiFlix-macOS.dmg
          ls -lh dist/ManiFlix-macOS.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManiFlix-macOS
          path: dist/ManiFlix-macOS.dmg
          retention-days: 30

  build-linux:
    name: Build Linux & Steam Deck (.AppImage + .deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            squashfs-tools \
            file \
            imagemagick

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build ManiFlix (Linux Release)
        run: |
          cd windows
          cargo build --release
          ls -lh target/release/ManiFlix

      - name: Run Self-Test Hardware & Binary Verification
        run: |
          ./windows/target/release/ManiFlix --self-test out.json
          cat out.json
          grep -q "SELF_TEST_OK" out.json
          ldd ./windows/target/release/ManiFlix

      - name: Package ManiFlix-Linux-amd64.deb & ManiFlix-Linux-x86_64.AppImage
        run: |
          set -euo pipefail
          mkdir -p dist
          WORK_DIR="/tmp/maniflix-linux-pkg"
          DEB_ROOT="$WORK_DIR/deb-root"
          rm -rf "$WORK_DIR"
          mkdir -p \
            "$DEB_ROOT/DEBIAN" \
            "$DEB_ROOT/usr/lib/maniflix" \
            "$DEB_ROOT/usr/bin" \
            "$DEB_ROOT/usr/share/applications"

          install -m 0755 windows/target/release/ManiFlix "$DEB_ROOT/usr/lib/maniflix/ManiFlix"
          strip --strip-unneeded "$DEB_ROOT/usr/lib/maniflix/ManiFlix" || true
          chmod 0755 "$DEB_ROOT/usr/lib/maniflix/ManiFlix"

          cat << 'EOF' > "$DEB_ROOT/usr/bin/maniflix"
          #!/bin/sh
          if [ -n "$WAYLAND_DISPLAY" ] && [ -e /proc/driver/nvidia/version ] && [ -z "$WEBKIT_DISABLE_DMABUF_RENDERER" ]; then
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
          fi
          exec /usr/lib/maniflix/ManiFlix "$@"
          EOF
          chmod 0755 "$DEB_ROOT/usr/bin/maniflix"

          cat << 'EOF' > "$DEB_ROOT/usr/share/applications/maniflix.desktop"
          [Desktop Entry]
          Name=ManiFlix
          Comment=ManiFlix Streaming Cinema (3D Liquid Glass)
          Exec=maniflix %U
          Icon=maniflix
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Player;TV;
          StartupWMClass=ManiFlix
          EOF
          chmod 0644 "$DEB_ROOT/usr/share/applications/maniflix.desktop"
          desktop-file-validate "$DEB_ROOT/usr/share/applications/maniflix.desktop"

          ICON_SRC="macos/ManiFlixMac/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          for sz in 64x64 128x128 256x256 512x512; do
            ICON_DIR="$DEB_ROOT/usr/share/icons/hicolor/$sz/apps"
            mkdir -p "$ICON_DIR"
            if command -v magick >/dev/null 2>&1; then
              magick "$ICON_SRC" -resize "$sz" "PNG32:$ICON_DIR/maniflix.png"
            else
              convert "$ICON_SRC" -resize "$sz" "PNG32:$ICON_DIR/maniflix.png"
            fi
            chmod 0644 "$ICON_DIR/maniflix.png"
          done

          INSTALLED_KB=$(du -sk "$DEB_ROOT/usr" | awk '{print $1}')
          cat << EOF > "$DEB_ROOT/DEBIAN/control"
          Package: maniflix
          Version: 2.0.2
          Section: video
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_KB}
          Maintainer: Maniakov <support@maniakov.bond>
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0
          Recommends: gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav
          Description: ManiFlix Streaming Cinema (3D Liquid Glass)
           High-performance native Linux and Steam Deck cinema desktop client
           with 3D Liquid Glass UI, multi-subtitle playback, and gamepad navigation.
          EOF
          chmod 0755 "$DEB_ROOT/DEBIAN"
          chmod 0644 "$DEB_ROOT/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$DEB_ROOT" dist/ManiFlix-Linux-amd64.deb
          dpkg-deb --info dist/ManiFlix-Linux-amd64.deb
          dpkg-deb --contents dist/ManiFlix-Linux-amd64.deb
          test -s dist/ManiFlix-Linux-amd64.deb

          APPDIR="$WORK_DIR/ManiFlix.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor"
          install -m 0755 "$DEB_ROOT/usr/lib/maniflix/ManiFlix" "$APPDIR/usr/bin/ManiFlix"
          ln -sf ManiFlix "$APPDIR/usr/bin/maniflix"
          cp -R "$DEB_ROOT/usr/share/icons/hicolor/." "$APPDIR/usr/share/icons/hicolor/"
          cp "$DEB_ROOT/usr/share/applications/maniflix.desktop" "$APPDIR/maniflix.desktop"
          cp "$DEB_ROOT/usr/share/applications/maniflix.desktop" "$APPDIR/usr/share/applications/maniflix.desktop"
          cp "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/maniflix.png" "$APPDIR/maniflix.png"
          cp "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/maniflix.png" "$APPDIR/.DirIcon"

          cat << 'EOF' > "$APPDIR/AppRun"
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          if [ -n "$WAYLAND_DISPLAY" ] && [ -e /proc/driver/nvidia/version ] && [ -z "$WEBKIT_DISABLE_DMABUF_RENDERER" ]; then
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
          fi
          exec "$HERE/usr/bin/ManiFlix" "$@"
          EOF
          chmod 0755 "$APPDIR/AppRun"

          WORKSPACE_DIST="$PWD/dist"
          pushd "$WORK_DIR" >/dev/null
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            -o appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null
          ARCH=x86_64 ./squashfs-root/AppRun ManiFlix.AppDir "$WORKSPACE_DIST/ManiFlix-Linux-x86_64.AppImage"
          popd >/dev/null

          chmod +x dist/ManiFlix-Linux-x86_64.AppImage
          file dist/ManiFlix-Linux-x86_64.AppImage
          test -s dist/ManiFlix-Linux-x86_64.AppImage
          ls -lh dist/ManiFlix-Linux-x86_64.AppImage dist/ManiFlix-Linux-amd64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ManiFlix-Linux
          path: |
            dist/ManiFlix-Linux-x86_64.AppImage
            dist/ManiFlix-Linux-amd64.deb
          retention-days: 30

  release:
    name: Publish GitHub Release v2.0.2
    needs: [ build-windows, build-macos, build-linux ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify Release Assets
        run: |
          ls -lh release-assets
          test -s release-assets/ManiFlix.exe
          test -s release-assets/ManiFlix-macOS.dmg
          test -s release-assets/ManiFlix-Linux-x86_64.AppImage
          test -s release-assets/ManiFlix-Linux-amd64.deb

      - name: Publish Release v2.0.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          name: ManiFlix Desktop v2.0.2
          body: |
            ## ManiFlix Desktop v2.0.2 (Build 202 — Windows, macOS, Linux & Steam Deck)
            - **Thông báo cập nhật ngay trong ứng dụng (2 cấp Soft / Force)**: Tự động kiểm tra bản mới, nhận diện định dạng phù hợp (`.exe`, `.dmg`, `.AppImage`, `.deb`), hỗ trợ nhắc lại sau 24 giờ cho bản cập nhật thường và hướng dẫn cài đặt nhanh `.deb`.
            - **Tăng tốc hiệu năng ≥2X trên Desktop & macOS**: Bổ sung bộ nhớ đệm RAM cục bộ trong Rust proxy (kèm nén HTTP gzip & giữ Cache-Control chuẩn), nạp nhanh Trang chủ qua bootstrap, tải trước chi tiết phim khi rê chuột/tay cầm và bộ nhớ đệm API + poster `NSCache` trên macOS.
            - **Cải thiện trình phát & điều khiển**: Khắc phục lỗi tua về 0 giây khi nhấn `Enter` trên trình phát Desktop, giữ phím `Enter` để Phát/Tạm dừng ổn định cùng điều hướng tay cầm 60fps.
            - **Bản cài đặt**: `ManiFlix.exe` (Windows), `ManiFlix-macOS.dmg` (macOS), `ManiFlix-Linux-x86_64.AppImage` (Linux Universal & Steam Deck), `ManiFlix-Linux-amd64.deb` (Ubuntu / Debian).
          files: |
            release-assets/ManiFlix.exe
            release-assets/ManiFlix-macOS.dmg
            release-assets/ManiFlix-Linux-x86_64.AppImage
            release-assets/ManiFlix-Linux-amd64.deb
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
