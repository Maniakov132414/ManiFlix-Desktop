name: ManiFlixMac
options:
  bundleIdPrefix: bond.maniakov
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "6"
    GENERATE_INFOPLIST_FILE: "NO"
    APP_BUNDLE_ID: "bond.maniakov.maniflix.mac"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    AD_HOC_CODE_SIGNING_ALLOWED: "YES"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  ManiFlixMac:
    type: application
    platform: macOS
    sources:
      - path: ManiFlixMac
        excludes:
          - "**/*.md"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        PRODUCT_NAME: ManiFlix
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ManiFlixMac/Info.plist
        COMBINE_HIDPI_IMAGES: "YES"
