[package]
name = "maniflix-desktop"
version = "1.1.1"
edition = "2021"
description = "ManiFlix Desktop App"

[[bin]]
name = "ManiFlix"
path = "src/main.rs"

[dependencies]
tao = "0.30"
wry = "0.47"
sysinfo = "0.32"
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
